name: Build APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      mandatory:
        description: "¿Actualización obligatoria? (el usuario no puede decir «Más tarde»)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Dónde se publican las actualizaciones. Por defecto, este mismo repositorio (debe ser PÚBLICO).
  # Si tu código es privado: crea otro repositorio público y guarda su nombre en Settings → Variables → RELEASES_REPO.
  RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }

      - name: Número de versión (sube solo en cada compilación)
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.8.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "UPDATE_URL=https://github.com/${RELEASES_REPO}/releases/latest/download/update.json" >> "$GITHUB_ENV"

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Drix-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Solo la rama main publica: crea una Release con Drix.apk y update.json (lo que lee la app para avisar)
      - name: Publicar actualización
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          MANDATORY: ${{ github.event.inputs.mandatory == 'true' }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Drix.apk
          SHA=$(sha256sum Drix.apk | cut -d' ' -f1)
          TAG="v${VERSION_CODE}"
          if [ -f RELEASE_NOTES.txt ]; then NOTES="$(cat RELEASE_NOTES.txt)"; else NOTES="$(git log -1 --pretty=%s)"; fi
          jq -n --argjson vc "$VERSION_CODE" --arg vn "$VERSION_NAME" \
                --arg url "https://github.com/${RELEASES_REPO}/releases/download/${TAG}/Drix.apk" \
                --arg sha "$SHA" --arg notes "$NOTES" --argjson mand "$MANDATORY" \
                '{versionCode:$vc, versionName:$vn, apkUrl:$url, sha256:$sha, notes:$notes, mandatory:$mand}' > update.json
          cat update.json
          gh release create "$TAG" Drix.apk update.json --repo "$RELEASES_REPO" \
             --title "Drix $VERSION_NAME" --notes "$NOTES" --latest
